<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <h1>Sentiment Analysis</h1>
        <p class="subtitle">Analyze whether your text expresses a positive or negative sentiment.</p>

        <div class="input-box">
            <textarea id="userText" rows="6" placeholder="Type your sentence or review here..."></textarea>
        </div>

        <button onclick="analyzeSentiment()">Analyze Sentiment</button>

        <div id="result" class="result-box"></div>
    </div>

    <script>
        async function analyzeSentiment() {
            const text = document.getElementById("userText").value;
            const resultDiv = document.getElementById("result");

            if (!text.trim()) {
                resultDiv.innerHTML = "<p class='error'>Please enter some text.</p>";
                return;
            }

            resultDiv.innerHTML = "<p class='loading'>Analyzing...</p>";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (data.sentiment) {
                    let sentimentClass = data.sentiment === "Positive" ? "positive" : "negative";

                    resultDiv.innerHTML = `
                        <div class="result-card ${sentimentClass}">
                            <h2>${data.sentiment}</h2>
                            <p>Confidence: ${data.confidence}%</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">${data.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = "<p class='error'>Something went wrong.</p>";
            }
        }
    </script>
</body>
</html>
